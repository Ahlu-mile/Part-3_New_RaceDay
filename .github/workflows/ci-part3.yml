name: RaceDay Part 3 CI
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore solution
        run: dotnet restore RaceDay.sln
      - name: Build solution
        run: dotnet build RaceDay.sln --configuration Release --no-restore
      - name: Build API container image
        run: docker build -f RaceDay.API/Dockerfile -t raceday-api:ci .
      - name: Build MVC container image
        run: docker build -f RaceDay.Mvc/Dockerfile -t raceday-mvc:ci .
      - name: Run API tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=raceday-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raceday-test-results
          path: '**/TestResults/*.trx'
